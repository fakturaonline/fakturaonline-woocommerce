# Push a tag like v0.1.0 and GitHub builds the plugin zip and attaches it to a release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bin/build-zip
      - run: gh release create "$GITHUB_REF_NAME" fakturaonline-woocommerce.zip --title "${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
